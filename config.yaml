hardware: rubikpi3
camera_type: picamera
mode: edge_standalone

paths:
  model_dir: model
  output_dir: outputs
  review_dir: ../data/review_queue # file du parent wall-e-core (quand runtime.review_export est actif)

models:
  rubikpi3: best_final_npu.dlc # best.onnx, best_final_npu.dlc or model.eim

camera:
  rubikpi3:
    source: 0
    width: 1280
    height: 720
    fps: 30
    warmup_frames: 5

detector:
  rubikpi3:
    backend: pysnpe # pysnpe, onnx or edge_impulse_http
    conf_threshold: 0.1
    iou_threshold: 0.45
    image_size: 640
    max_detections: 8
    edge_impulse_url: http://127.0.0.1:1337
    edge_impulse_timeout_sec: 5.0

runtime:
  show: false
  infer_every_n_frames: 1
  save_every_n_frames: 20
  camera_test_mode: true
  camera_test_interval_sec: 5.0
  debug_inference: true
  review_export: false # true => exporte image brute + bbox vers paths.review_dir (pour wall-e-core)
